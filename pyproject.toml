[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recolib"
version = "0.1.0"
description = "A small two-stage (retrieval + learning-to-rank) recommender library, built on PySpark + LightGBM."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5",
    "lightgbm>=4.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "pyarrow>=12.0",
]

[project.scripts]
recolib = "recolib.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["recolib*"]
